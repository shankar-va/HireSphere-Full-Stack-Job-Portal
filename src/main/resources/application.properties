# ==================================
# Application & Server Settings
# ==================================
spring.application.name=HireSphere-Full-Stack-Job-Portal
server.port=8082

# ==================================
# Database Configuration (PostgreSQL)
# ==================================
spring.datasource.url=jdbc:postgresql://localhost:5432/Hiresphere
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================================
# JPA / Hibernate Configuration
# ==================================
# Controls auto DDL generation: update, validate, create, create-drop, or none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Open-In-View pattern setting (disabled to avoid keeping DB sessions open unnecessarily)
spring.jpa.open-in-view=false
# Enable/Disable automatic restart (Defaults to true)
spring.devtools.restart.enabled=true

# Exclude static assets from triggering full server restarts (they will just reload)
spring.devtools.restart.exclude=static/**,templates/**


#Jwt Configurations
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=spring-jwt-api
security.jwt.audience=spring-jwt-client
security.jwt.access-token-ms=900000

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile, email

# Custom property for where to send the user after login
app.frontend.oauth2.redirect-url=http://localhost:8082/api/user